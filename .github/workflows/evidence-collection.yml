name: Evidence collection

on:
  pull_request:
    paths:
      - 'internal/transport/http/server.go'
      - 'internal/transport/http/evidence_asset_test.go'
      - 'internal/transport/http/web/index.html'
      - 'internal/transport/http/web/evidence_collection*'
      - 'scripts/evidence_collection_smoke.py'
      - 'docs/evidence-collections.md'
      - '.github/workflows/evidence-collection.yml'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [main]
    paths:
      - 'internal/transport/http/server.go'
      - 'internal/transport/http/evidence_asset_test.go'
      - 'internal/transport/http/web/index.html'
      - 'internal/transport/http/web/evidence_collection*'
      - 'scripts/evidence_collection_smoke.py'
      - 'docs/evidence-collections.md'
      - '.github/workflows/evidence-collection.yml'
      - 'go.mod'
      - 'go.sum'
permissions:
  contents: read

jobs:
  browser-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and pinned test driver
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium chromium-driver
          python -m pip install selenium==4.35.0
      - name: Native module tests
        run: node --test internal/transport/http/web/citation_test.mjs internal/transport/http/web/source_management_test.mjs internal/transport/http/web/evidence_collection_test.mjs
      - name: Static asset and embedded server checks
        run: go test ./internal/transport/http
      - name: Compile server and run real browser journey
        run: |
          go build -o /tmp/findrail ./cmd/findrail
          python scripts/evidence_collection_smoke.py /tmp/findrail
